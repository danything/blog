# コメントサーバ yosegaki (https://github.com/danything/yosegaki)。
# チャートは yosegaki 側の CI が OCI で ghcr に push する。version は 0.1.<CI の run 番号>
# (取り消された run の番号は飛ぶので、連番とは限らない)。
# 秘密 (secret, oidc-client-secret, smtp-password, turnstile-secret) は Secret yosegaki-secrets にあり、
# secrets.sops.yaml の SopsSecret が作る。chart は existingSecret の名前で読むだけ。
# chart の Deployment の注釈は Infisical の auto-reload なので、値を変えても Pod は入れ替わらない (rollout restart する)。
#
# **k3s の HelmChart CRD から移した (2026-09-07)。** HelmChart は k3s 固有で Talos には無い。
# **PVC (yosegaki-db) を持つので、HelmChart CR を消すときは先に helm のリリース Secret を
# 消してアンインストールを空振りさせること** (danything/gitops の docs/decisions.md)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yosegaki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: blog
  source:
    repoURL: ghcr.io/danything/charts
    chart: yosegaki
    targetRevision: 0.1.64
    helm:
      releaseName: yosegaki
      valuesObject:
        host: yk.doany.io
        # 公開は Cilium Gateway。HTTPRoute は danything/gitops の
        # apps/gateway-routes/blog-yosegaki.yaml にあるので、chart の Ingress は要らない
        ingress:
          enabled: false
        siteName: b.doany.io
        # ブログは doany.io から b.doany.io に移った。doany.io (コーポレートサイト) にはコメント欄が無い
        allowedOrigins:
          - https://b.doany.io
        # 承認なしで公開。bot は Turnstile で止める
        moderation: none
        admin:
          name: ruk
          email: info@doany.io
        # 管理者は Entra ID でログインする。ArgoCD と同じアプリ登録・同じ "admins" グループ
        # (bootstrap/argocd/helmchart.yaml の RBAC と同じ Object ID)。client secret は
        # yosegaki-secrets の oidc-client-secret
        oidc:
          issuer: https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/v2.0
          clientId: b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e
          # Entra のアプリロール。yosegaki は groups と roles を合わせて見る
          # (src/lib/server/oidc.ts)。以前はグループの Object ID を並べていたが、
          # 2026-09-07 にロールへ移した (danything/gitops の docs/entra.md)
          adminGroups:
            - admin
          label: Microsoft
        turnstile:
          # Cloudflare ダッシュボード → Turnstile → doany.io のウィジェット。公開値
          siteKey: 0x4AAAAAAEoiKxn884OxoH4h
        smtp:
          # 中継(gitops の deploy/smtp-relay。Graph の sendMail)。ユーザー名は <テナント ID>@<smtp-relay のクライアント ID>、TLS なし
          host: smtp-relay.smtp-relay.svc
          port: 587
          user: "22ac977d-b140-4dc8-8150-90d645d3475b@fd45a316-97cc-4480-8da8-487109403520"
          from: info@doany.io
        # Secret は secrets.sops.yaml (SopsSecret) が作る。chart に InfisicalSecret を作らせない
        existingSecret: yosegaki-secrets
        infisicalSecret:
          enabled: false
        persistence:
          storageClass: local-path
          # 新しく作るときは VolSync が R2 の最新から中身を埋める (deploy/volsync.yaml の yosegaki-db-dst)。今ある PVC には効かない
          dataSourceRef:
            {
              apiGroup: volsync.backube,
              kind: ReplicationDestination,
              name: yosegaki-db-dst,
            }
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 下の ignoreDifferences を適用でも触らない (今ある PVC の dataSourceRef は書けない)
      - RespectIgnoreDifferences=true
  # PVC の dataSourceRef (VolSync の populator) は作るときにしか書けない。今ある PVC には当てない
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers: [/spec/dataSourceRef, /spec/dataSource]

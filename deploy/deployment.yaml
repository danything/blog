apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: blog
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 新しい Pod が Ready になってから古い Pod を落とす
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      # Caddy は root ではない uid (Dockerfile の USER と同じ) で、8080 番で待つ
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blog
          image: ghcr.io/danything/blog:9a0463d283f7d8ebaa79763165afb5753136b0ef
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          # ルートは読み取り専用。Caddy が書く XDG_DATA_HOME (instance.uuid やロック) だけ書けるようにする
          volumeMounts:
            - name: caddy-data
              mountPath: /data
      volumes:
        - name: caddy-data
          emptyDir:
            sizeLimit: 16Mi

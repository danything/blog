apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: blog
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 新しい Pod が Ready になってから古い Pod を落とす
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      # Caddy は root ではない uid (Dockerfile の USER と同じ) で、8080 番で待つ
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blog
          image: ghcr.io/danything/blog:c52e6f84b85e9c488bdbea2994574b247b51a700
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          # 止める前に少し待つ。Pod の終了と Service の宛先から外れるのが同時に進むので、待たないと
          # 外れる前の数秒に来たリクエストが落ちる(デプロイのたびに 0〜1 件の 503 が出ていた)。
          # sleep はイメージ (alpine) の busybox のもの。猶予 (terminationGracePeriodSeconds 既定 30 秒) より短くする
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # ルートは読み取り専用。Caddy が書く XDG_DATA_HOME (instance.uuid やロック) だけ書けるようにする
          volumeMounts:
            - name: caddy-data
              mountPath: /data
      volumes:
        - name: caddy-data
          emptyDir:
            sizeLimit: 16Mi

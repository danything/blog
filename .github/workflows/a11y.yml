name: A11y Check

# ビルドしたサイトを axe で調べ、WCAG 2.1 A/AA の違反(影響が serious・critical のもの)がないかを
# 確かめる(tests/a11y.spec.ts)。違反があると失敗し、playwright-report として添付する。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # translate.yml が英訳の PR に対して呼ぶ

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager の版(Dockerfile の oven/bun と同じ)

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub カードの情報を取るため

      - run: bunx playwright install --with-deps chromium

      - name: アクセシビリティを調べる
        run: |
          scripts/serve.sh dist 4321
          BASE_URL=http://127.0.0.1:4321 bunx playwright test tests/a11y.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

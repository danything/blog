name: Check

# PR で型チェック(astro check)を通す
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # translate.yml が英訳の PR に対して呼ぶ

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Biome の検査と型チェック(biome check . && astro check。astro check は .astro と tsconfig.json の include の .ts を調べる)
      - run: bun run lint

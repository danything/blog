name: Check

# PR で型チェック(astro check)を通す
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Biome の検査と型チェック(biome check . && astro check && tsc --noEmit)
      - run: bun run lint

name: Check

# PR で型チェック(astro check)を通す
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # translate.yml が英訳の PR に対して呼ぶ

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager の版(Dockerfile の oven/bun と同じ)
      - run: bun install --frozen-lockfile
      # Biome の検査と型チェック(biome check . && astro check。astro check は .astro と tsconfig.json の include の .ts を調べる)
      - run: bun run lint

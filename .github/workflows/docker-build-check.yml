name: Docker Build Check

# PR で Dockerfile のビルドが通るかを確かめる。main への push は docker-publish.yml が
# ビルドしてそのまま公開するので、壊れた変更がそこまで行かないようにする
# (Renovate の自動マージもこのチェックを待つ)
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

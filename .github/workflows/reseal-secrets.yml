name: Reseal secrets

# 平文の値は GitHub Secrets 側にだけ置く。sealed-secrets コントローラーの公開鍵
# (非秘密) は org の Actions variable `SEALED_SECRETS_PUB_CERT` に置いていて、
# それで kubeseal し、結果の SealedSecret だけをコミットする。値を変えたら
# Secrets を更新してこのワークフローを再実行する。鍵のローテーションは
# bootstrap/fetch-cert.sh 参照（org変数の更新もそちらで行う）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal artalk-secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PUB_CERT: ${{ vars.SEALED_SECRETS_PUB_CERT }}
        run: |
          set -eu
          if ! command -v kubeseal >/dev/null 2>&1; then
            curl -sfL "https://github.com/bitnami/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz" \
              | tar -xz -C /tmp kubeseal
            sudo install -m 0755 /tmp/kubeseal /usr/local/bin/kubeseal
          fi

          printf '%s' "$PUB_CERT" > /tmp/pub-cert.pem

          kubectl create secret generic artalk-secrets \
            --namespace blog \
            --from-literal=admin-password="$ADMIN_PASSWORD" \
            --from-literal=app-key="$APP_KEY" \
            --from-literal=smtp-password="$SMTP_PASSWORD" \
            --dry-run=client -o yaml \
          | kubeseal --cert /tmp/pub-cert.pem --format yaml \
          > k3s/artalk-secret.yaml

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k3s/artalk-secret.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal artalk-secrets"
          git push

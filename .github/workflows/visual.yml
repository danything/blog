name: Visual Check

# PR の見た目が main と変わっていないかを確かめる。main のビルドで撮ったスクリーンショットを基準に、
# PR のビルドと 1 ピクセル単位で比べる(tests/visual.spec.ts)。差があると失敗し、差分の画像を
# playwright-report として添付する。意図して見た目を変える PR では、差分を確認してからマージする。
# Renovate の自動マージはこのチェックが通らないと止まる。
#
# 比べるのは実際の記事ではなく、tests/fixtures/ の固定の記事だけで作ったサイト(VISUAL_FIXTURES=1 で
# ビルドする。src/constants/content-dir.ts)。記事の追加・編集・削除だけの PR では差が出ず、
# デザインやコードを変えたときだけ差が出る。実際の記事は a11y.yml が調べる。
# 新しい書き方や部品を足したときは、tests/fixtures/ の記事にも足して比較の対象にする。
on:
  pull_request:
    branches: [main]
  # translate.yml が英訳の PR に対して呼ぶ。このときは実行したブランチと main の分岐点を基準にする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      # PR を先にビルドする(main を取り出す .base/ を Tailwind が走査しないように)
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VISUAL_FIXTURES: 1 # GitHub カードも api.github.com に取りに行かず固定の値を使う

      # PR ではビルドしたのは main とのマージコミットなので、その 1 つ目の親(マージに使った main)と比べる。
      # pull_request.base.sha は PR を作ったときの古い main のことがあり、あとで main に入った変更まで差に出てしまう。
      # workflow_dispatch ではマージしたものではなくブランチそのものをビルドしているので、main との分岐点と比べる
      - name: 基準のコミットを決める
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          else
            BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .base

      # 固定の記事を入れる前の main には tests/fixtures/ が無い。そのときは PR の固定の記事と、それを
      # 読むための仕組みを main に重ねてビルドし、記事以外(デザイン・コード)が main のままの基準を作る
      - name: main に固定の記事が無ければ PR から持ってくる
        run: |
          if [ ! -d .base/tests/fixtures ]; then
            echo "::notice::main に tests/fixtures/ が無いので、PR の固定の記事と読み込みの仕組みを重ねて基準を作ります"
            for f in tests/fixtures src/constants/content-dir.ts src/content.config.ts src/plugins/remark-github-card.ts src/styles/main.css; do
              mkdir -p ".base/$(dirname "$f")"
              rm -rf ".base/$f"
              cp -r "$f" ".base/$f"
            done
          fi
      - run: bun install --frozen-lockfile && bun run build
        working-directory: .base
        env:
          VISUAL_FIXTURES: 1

      - run: bunx playwright install --with-deps chromium

      - name: main のスクリーンショットを基準にする
        run: |
          (cd .base/dist && python3 -m http.server 4321 --bind 127.0.0.1 &)
          until curl -s -o /dev/null http://127.0.0.1:4321/; do sleep 1; done
          BASE_URL=http://127.0.0.1:4321 bunx playwright test tests/visual.spec.ts --update-snapshots --reporter=dot

      - name: PR と比べる
        run: |
          (cd dist && python3 -m http.server 4322 --bind 127.0.0.1 &)
          until curl -s -o /dev/null http://127.0.0.1:4322/; do sleep 1; done
          BASE_URL=http://127.0.0.1:4322 bunx playwright test tests/visual.spec.ts

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

name: Visual Check

# PR の見た目が main と変わっていないかを確かめる。main のビルドで撮ったスクリーンショットを基準に、
# PR のビルドと 1 ピクセル単位で比べる(tests/visual.spec.ts)。差があると失敗し、差分の画像を
# playwright-report として添付する。意図して見た目を変える PR では、差分を確認してからマージする。
# Renovate の自動マージはこのチェックが通らないと止まる。
#
# 比べるのは実際の記事ではなく、tests/fixtures/ の固定の記事だけで作ったサイト(VISUAL_FIXTURES=1 で
# ビルドする。src/constants/content-dir.ts)。記事の追加・編集・削除だけの PR では差が出ず、
# デザインやコードを変えたときだけ差が出る。実際の記事は a11y.yml が調べる。
# 新しい書き方や部品を足したときは、tests/fixtures/ の記事にも足して比較の対象にする。
on:
  pull_request:
    branches: [main]
  # translate.yml が英訳の PR に対して呼ぶ。このときは実行したブランチと main の分岐点を基準にする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager の版(Dockerfile の oven/bun と同じ)
      # astro は Node で動く。ランナーの既定の Node は版が古いことがある (astro 7.4.2 は 22.23.4 以上)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          # 手元の toolcache の古い 22 で済ませず、22 の最新を取りに行く
          check-latest: true

      # PR を先にビルドする
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VISUAL_FIXTURES: 1 # GitHub カードも api.github.com に取りに行かず固定の値を使う

      # PR ではビルドしたのは main とのマージコミットなので、その 1 つ目の親(マージに使った main)と比べる。
      # pull_request.base.sha は PR を作ったときの古い main のことがあり、あとで main に入った変更まで差に出てしまう。
      # workflow_dispatch ではマージしたものではなくブランチそのものをビルドしているので、main との分岐点と比べる
      #
      # 基準は main の履歴にあるコミットでなければならない。workflow_dispatch は main でも起こせ、そのときは
      # main のキャッシュの範囲で動く。ここで main にないコミットを checkout してビルドすると、そのコードが
      # main のキャッシュを書き換えられてしまう(キャッシュ汚染)。そこで .base には main を checkout し、
      # 基準のコミットが main の祖先であることを確かめてからそこへ移る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .base
          fetch-depth: 0 # 基準のコミットへ移るため。中身は移ったときに取る
          filter: blob:none

      - name: 基準のコミットへ移る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .merge_base_commit.sha)
          fi
          cd .base
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "::error::基準のコミット $base が main の履歴にありません"
            exit 1
          fi
          git switch --quiet --detach "$base"
          echo "基準: $base"

      - run: bun install --frozen-lockfile && bun run build
        working-directory: .base
        env:
          VISUAL_FIXTURES: 1

      - run: bunx playwright install --with-deps chromium

      - name: main のスクリーンショットを基準にする
        run: |
          scripts/serve.sh .base/dist 4321
          BASE_URL=http://127.0.0.1:4321 bunx playwright test tests/visual.spec.ts --update-snapshots --reporter=dot

      - name: PR と比べる
        run: |
          scripts/serve.sh dist 4322
          BASE_URL=http://127.0.0.1:4322 bunx playwright test tests/visual.spec.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

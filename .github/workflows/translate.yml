name: Translate

# 記事の英訳(/en/)を Claude で作り、PR にする。決まりは .github/translate.md。
# 原文と英訳の対応は scripts/translate-status.ts で調べる(英訳の sourceHash と原文のハッシュを比べる)。
# 未訳・原文が変わった・原文が消えたものだけを直し、translate/auto ブランチの PR にまとめる。
# 検査がすべて通ったら自動でマージし、デプロイ(docker.yml)を起こす(merge のジョブ)。
#
# GITHUB_TOKEN で作った PR や push では、ほかのワークフロー(Check・A11y Check など)が動かない。
# 例外として workflow_dispatch は GITHUB_TOKEN でも起こせるので、PR を作った・更新したあとに
# 検査のワークフローを translate/auto ブランチで実行する(checks のジョブ)。
# ただし workflow_dispatch の実行は PR の head のコミットに付いても PR の Checks には出ないので、
# 終わるのを待ってその結果をコミットのステータスとして PR の head に付ける。
# 検査を手で再実行したときは、ステータスは更新されない(translate.yml を実行し直す)。
# Claude Code Review は呼ばない(PR のイベントでしか動かず、bot の PR は対象外にしている)。
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**.md"
      - "src/content/spec/about.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      BRANCH: translate/auto
    outputs:
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 原文の変更点を git log / git diff で見るため

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager の版(Dockerfile の oven/bun と同じ)

      - run: bun install --frozen-lockfile

      # まだマージしていない前回の英訳 PR があれば、その英訳から続ける
      # (同じ記事を訳し直さず、原文の変わった分だけを直すため)。
      # 前回の PR で消したファイルは戻らないが、原文が無ければ次のステップで消える
      - name: Restore the previous translations
        run: |
          if git fetch --quiet origin "$BRANCH"; then
            git restore --source FETCH_HEAD -- src/content/posts-en || true
            git restore --source FETCH_HEAD -- src/content/spec/about-en.md || true
          fi

      - name: Check translation status
        id: status
        run: |
          bun scripts/translate-status.ts
          json=$(bun scripts/translate-status.ts --json)
          echo "json=$json" >> "$GITHUB_OUTPUT"
          count=$(echo "$json" | jq '[.missing, .outdated, .orphaned] | map(length) | add')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # 原文が無くなった英訳はここで消す(Claude には訳すことだけを頼む)
          echo "$json" | jq -r '.orphaned[]' | xargs -r rm -v --
          echo "todo=$(echo "$json" | jq -c '{missing, outdated}')" >> "$GITHUB_OUTPUT"

      # claude-code-action は push のイベントで動かない(Unsupported event type: push)ので、
      # Claude Code の CLI をそのまま非対話で呼ぶ
      - name: Translate
        if: steps.status.outputs.todo != '{"missing":[],"outdated":[]}'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TODO: ${{ steps.status.outputs.todo }}
          # 版を固定する(Renovate が renovate.json の customManagers で上げる)
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_CODE_VERSION: 2.1.294
        run: |
          # 'EOF' で囲んで中のバッククォートを展開させず、対象だけをあとから差し込む
          prompt=$(cat <<'EOF'
            このブログ(Astro 製、日本語)の記事の英訳を更新してください。
            まず .github/translate.md を読み、その決まりに従ってください。

            対象(scripts/translate-status.ts の出力。source が日本語の原文、target が英訳):
            __TODO__

            - missing: 英訳がまだ無い。原文を読んで target に英訳を新しく作る
            - outdated: 原文が変わった。`git diff` などで原文の変更点を確かめ、既存の英訳を、
              変わった箇所が反映されるよう最小限だけ直す(訳し直さない。変わっていない部分の訳文は変えない)。
              原文の差分が分からないときは、原文と既存の英訳を突き合わせて食い違う箇所だけを直す
            - 作った・直した英訳のフロントマターの sourceHash は、
              `bun scripts/translate-status.ts --hash <原文のパス>` の値にする

            守ること:
            - 変更してよいのは src/content/posts-en/、src/content/spec/about-en.md、
              .github/translate.md(カテゴリ・タグの対応表に足すときだけ)。原文やほかのファイルは変えない
            - 上に挙がっていないファイルは触らない
            - git の commit・push はしない(このあとのステップで PR にする)
            - 最後に `bun scripts/translate-status.ts --check` を実行し、「英訳はすべて最新です」と出ることを確かめる
          EOF
          )
          prompt=${prompt//__TODO__/$TODO}
          bunx "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" -p "$prompt" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(bun scripts/translate-status.ts:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      # 訳が残っていないか、フロントマターや Markdown が壊れていないかを確かめる
      - name: Verify
        if: steps.status.outputs.count != '0'
        run: |
          if ! bun scripts/translate-status.ts --check; then
            echo "::error::英訳が終わっていないものがあります"
            exit 1
          fi
          # 英訳とその決まり以外のファイルを変えていないか
          others=$(git status --porcelain --untracked-files=all | cut -c4- \
            | grep -vE '^(src/content/posts-en/|src/content/spec/about-en\.md$|\.github/translate\.md$)' || true)
          if [ -n "$others" ]; then
            echo "::error::英訳以外のファイルが変わっています: $others"
            exit 1
          fi
          bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub カードの情報を取るため

      - name: Open a pull request
        id: pr
        if: steps.status.outputs.count != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          base: main
          add-paths: |
            src/content/posts-en
            src/content/spec/about-en.md
            .github/translate.md
          commit-message: 英訳を更新
          title: 英訳を更新
          body: |
            `.github/workflows/translate.yml` が ${{ github.sha }} の時点の原文から英訳を更新しました。

            対象:
            ```json
            ${{ steps.status.outputs.todo }}
            ```

            - 訳文は .github/translate.md の決まりで Claude が作っています
            - 下の検査がすべて通ると自動でマージされ、デプロイされます。落ちたときは開いたまま残るので、直してからマージしてください
            - この PR は GITHUB_TOKEN で作っているため、PR のイベントではほかのワークフローが動きません。
              代わりに translate.yml が Check・A11y Check・Visual Check・Docker Build Check を workflow_dispatch で実行し、
              終わると結果がこの PR のステータスとして出ます(Claude Code Review は動きません)
          delete-branch: true

  # PR のイベントでは検査が動かないので、workflow_dispatch で PR のブランチに対して実行し、
  # 結果を PR の head のコミットのステータスにする
  checks:
    needs: translate
    if: needs.translate.outputs.operation == 'created' || needs.translate.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run で起こすため
      checks: read # gh run watch で結果を見るため
      statuses: write # 結果をコミットのステータスにするため
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workflow: check.yml, name: Check }
          - { workflow: a11y.yml, name: A11y Check }
          - { workflow: visual.yml, name: Visual Check }
          - { workflow: docker.yml, name: Docker Build Check }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: translate/auto
      HEAD_SHA: ${{ needs.translate.outputs.head-sha }}
      WORKFLOW: ${{ matrix.workflow }}
      NAME: ${{ matrix.name }}
    steps:
      - name: Run ${{ matrix.name }}
        run: |
          status() {
            gh api "repos/$GH_REPO/statuses/$HEAD_SHA" -f state="$1" -f context="$NAME" \
              -f description="$2" ${url:+-f target_url="$url"} > /dev/null
          }
          since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "$WORKFLOW" --ref "$BRANCH"
          # 起こした実行を探す(すぐには一覧に出ない)
          for _ in $(seq 30); do
            run=$(gh run list --workflow "$WORKFLOW" --branch "$BRANCH" --event workflow_dispatch \
              --commit "$HEAD_SHA" --created ">=$since" --limit 1 --json databaseId,url --jq '.[0] // empty')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            status error "workflow_dispatch の実行が見つかりません"
            echo "::error::$WORKFLOW の実行が見つかりません"
            exit 1
          fi
          id=$(echo "$run" | jq -r .databaseId)
          url=$(echo "$run" | jq -r .url)
          status pending "workflow_dispatch で実行中"
          if gh run watch "$id" --exit-status --interval 30 > /dev/null; then
            status success "workflow_dispatch で成功"
          else
            status failure "workflow_dispatch で失敗"
            echo "::error::$NAME が失敗しました: $url"
            exit 1 # merge のジョブを止める
          fi

  # 検査がすべて通ったら PR をマージする。GITHUB_TOKEN でのマージ(main への push)ではデプロイの
  # ワークフローが動かないので、docker.yml を main で workflow_dispatch で起こす。
  # 検査が 1 つでも落ちたら、PR は開いたまま残る(直してから手でマージする)
  merge:
    needs: [translate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.translate.outputs.head-sha }}
    steps:
      - name: Merge and deploy
        run: |
          # 検査のあいだに PR が更新されていたら、新しいほうの実行に任せる
          gh pr merge translate/auto --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run docker.yml --ref main

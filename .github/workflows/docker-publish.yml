name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # コンテナのリポジトリ名は小文字でなければならないため変換する
      - name: Resolve image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushes with the default GITHUB_TOKEN don't trigger new workflow runs,
      # so this commit does not re-trigger this workflow.
      - name: Update deployment image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 他のジョブ (zenn-sync や連続した push) が先に main を進めていることがある。
          # 自分のコミットを rebase すると image: の同じ行でほぼ必ず衝突するため、
          # 毎回 main を取り直して sed をやり直す。この操作は冪等。
          for _ in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            sed -i "s#image: ${REGISTRY}/${IMAGE_NAME}:.*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" k3s/deployment.yaml

            if git diff --quiet -- k3s/deployment.yaml; then
              echo "変更なし"
              exit 0
            fi

            git add k3s/deployment.yaml
            git commit --quiet -m "chore: update blog image to ${GITHUB_SHA}"

            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

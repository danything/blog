name: Build

# PR でビルドが通るかを確かめる。main への push は docker-publish.yml がビルドして公開するので、
# 壊れた変更がそこまで行かないようにする(Renovate の自動マージもこのチェックを待つ)
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dockerfile と同じ Node 24 + corepack(package.json の packageManager の pnpm)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
